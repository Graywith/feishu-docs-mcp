[project]
name = "feishu-docs-mcp"
version = "0.4.1"
description = "Structured Feishu Docs, Wiki, attachments, and MindNote access through MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.1,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.scripts]
feishu-docs-mcp = "feishu_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feishu_mcp"]
